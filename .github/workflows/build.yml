name: Build index.html
on:
  push:
    branches: [main]
    paths: ['src/**', 'build.py']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.x' }
      - name: Bundle sources into index.html
        run: |
          python3 build.py
          cp dist/bengali-panjika.html index.html
      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "chore: rebuild index.html from src"
          git push
